stages:
  - test-frontend
  # - test-backend

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "development"
    - when: never

debug-runner:
  stage: test-frontend
  image: alpine
  services: []
  before_script: []
  script:
    - cat /proc/1/cgroup
    - env | grep -i runner
    - whoami
    - cat /etc/os-release

