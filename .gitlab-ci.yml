stages:
  - test-frontend
  # - test-backend

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "development"
    - when: never

test-frontend:
  stage: test-frontend
  script:
    - docker compose --profile frontend-test up --build