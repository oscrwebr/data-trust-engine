    "itsdangerous>=2.2.0",
    "SQLAlchemy>=2.0.46",
    "greenlet>=3.3.2",
    "PyMySQL>=1.1.2",
    "Mako>=1.3.10",
    "alembic>=1.18.4",
    "iniconfig>=2.3.0",
    "packaging>=26.0",
    "pluggy>=1.6.0",
    "pytest>=9.0.2",
    "spacy",
    "Pillow",
