services:
  database-dev:
    image: mariadb:11.8-noble
    profiles: ["dev"]
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME}
    volumes:
      - dte-db-volume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"] # https://mariadb.com/docs/server/server-management/automated-mariadb-deployment-and-administration/docker-and-mariadb/using-healthcheck-sh
      start_period: 40s
      interval: 10s
      timeout: 5s
      retries: 5

  database-test:
    image: mariadb:11.8-noble
    profiles: ["test"]
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PASSWORD}
      - MARIADB_DATABASE=${DB_TEST_NAME}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"] # https://mariadb.com/docs/server/server-management/automated-mariadb-deployment-and-administration/docker-and-mariadb/using-healthcheck-sh
      start_period: 40s
      interval: 10s
      timeout: 5s
      retries: 5

  alembic_migrations-dev:
    build: ./backend
    image: fastapi-backend:latest
    profiles: ["dev"]
    environment:
      - DB_HOST=database-dev
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_TEST_NAME=${DB_TEST_NAME}
    command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      database-dev:
        condition: service_healthy

  backend-dev:
    image: fastapi-backend:latest
    profiles: ["dev"]
    pull_policy: never
    ports:
      - 8000:8000
    environment:
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - TENANT_ID=${TENANT_ID}
      - AUTHORITY=${AUTHORITY}
      - SCOPES=${SCOPES}
      - DB_HOST=database-dev
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_TEST_NAME=${DB_TEST_NAME}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - ALGORITHM=${ALGORITHM}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - ZEROBOUNCE_API_KEY=${ZEROBOUNCE_API_KEY}
      - FERNET_KEY=${FERNET_KEY}
    depends_on:
      alembic_migrations-dev:
        condition: service_completed_successfully
  
  backend-test:
    image: fastapi-backend:latest
    profiles: ["test-backend"]
    pull_policy: never
    environment:
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - TENANT_ID=${TENANT_ID}
      - AUTHORITY=${AUTHORITY}
      - SCOPES=${SCOPES}
      - DB_HOST=database-test
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_TEST_NAME=${DB_TEST_NAME}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - ALGORITHM=${ALGORITHM}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - ZEROBOUNCE_API_KEY=${ZEROBOUNCE_API_KEY}
      - FERNET_KEY=${FERNET_KEY}
    command: pytest --cov-fail-under=90 --cov-report=html --cov=app
    depends_on:
      database-test:
        condition: service_healthy


volumes:
  dte-db-volume: